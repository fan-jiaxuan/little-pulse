<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8e8e7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="./icons/icon-192.png"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"><title>Little Pulse · 胎动记录</title></head><body><main><header><div><small>LITTLE PULSE</small><h1>宝宝今天动了吗？</h1><p id="week">私密的胎动日记</p></div><span class="heart">♥</span></header><nav><button class="tab selected" data-tab="record">记录</button><button class="tab" data-tab="history">历史</button><button class="tab" data-tab="trend">趋势</button><button class="tab" data-tab="settings">设置</button></nav><section id="record" class="page"><article class="center"><p>本次记录</p><div class="number"><span id="count">0</span><small>次</small></div><button id="kick" class="kick" disabled><span>♥</span><strong>记录一次胎动</strong><small>轻触记录</small></button><div class="strength"><label><input type="radio" name="strength" value="轻微">轻微</label><label><input type="radio" name="strength" value="明显" checked>明显</label><label><input type="radio" name="strength" value="强烈">强烈</label></div><div class="actions"><button id="start" class="primary">开始记录</button><button id="undo" hidden>撤销</button><button id="end" hidden class="primary">结束并保存</button></div><p id="sessionState" class="muted">尚未开始</p></article><article><div class="row"><h2>最近记录</h2><button id="add" class="textbutton">＋ 补录</button></div><div id="recent" class="muted">暂无记录</div></article></section><section id="history" class="page" hidden><article><div class="row"><h2>历史胎动</h2><button id="addHistory" class="textbutton">＋ 补录</button></div><div id="historyList"></div></article></section><section id="trend" class="page" hidden><article><div class="row"><h2>每日胎动次数</h2><select id="days"><option value="7">近7天</option><option value="14">近14天</option><option value="30">近30天</option></select></div><div id="chart"></div><p class="muted">图表仅展示记录次数，不代表胎儿健康状态，也不用于诊断。</p></article></section><section id="settings" class="page" hidden><article><h2>预产期</h2><label>预计分娩日期 <input type="date" id="due"></label><p class="muted">孕周由预产期估算，可随时修改。</p></article><article><h2>数据管理</h2><button id="csv">导出 CSV</button><button id="json">导出 JSON 备份</button><label class="import">导入 JSON 备份<input id="import" type="file" accept="application/json,.json" hidden></label><p class="muted">所有记录只保存在当前设备的浏览器存储中。请定期备份；清除网站数据可能导致记录丢失。</p></article></section><footer>胎动减少、变弱或与平时明显不同时，请及时联系产科或助产士，不要依赖本应用计数结果等待。</footer></main><dialog id="editor"><form id="editForm"><h2 id="editTitle">编辑胎动</h2><label>日期和时间<input id="editTime" type="datetime-local" required></label><label>强度<select id="editStrength"><option>轻微</option><option>明显</option><option>强烈</option></select></label><div class="actions"><button type="button" id="cancel">取消</button><button type="button" id="delete" class="danger">删除</button><button class="primary" type="submit">保存</button></div></form></dialog><script src="./app.js" defer></script></body></html>
